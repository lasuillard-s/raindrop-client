name: API Drift Detection

on:
  schedule:
    - cron: '0 0 * * 0' # Weekly on Sunday at midnight UTC
  workflow_dispatch: # Allow manual triggering

jobs:
  detect-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dbe4041e # v6
        with:
          node-version-file: package.json
          cache: npm

      - name: Update npm
        run: npm install --global npm@latest

      - name: Install deps
        run: npm ci

      - name: Refresh test recordings
        id: refresh
        env:
          __RAINDROP_CLIENT_TEST_API_TOKEN: ${{ secrets.__RAINDROP_CLIENT_TEST_API_TOKEN }}
        run: |
          if [ -z "${__RAINDROP_CLIENT_TEST_API_TOKEN}" ]; then
            echo "__RAINDROP_CLIENT_TEST_API_TOKEN not set, skipping drift detection"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          rm -rf ./tests/__recordings__/*
          npm run test:unit --update
          npm run test:type

      - name: Check for API drift
        id: drift
        run: |
          if git diff --exit-code tests/__recordings__/ tests/__typechecks__/; then
            echo "No API drift detected"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "API drift detected"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate GitHub App token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3
        id: generate-token
        with:
          client-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Create pull request for API drift
        if: steps.drift.outputs.has_changes == 'true' && steps.refresh.outputs.skip != 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.generate-token.outputs.token }}
          sign-commits: true
          commit-message: "fix: update API recordings due to drift detected"
          title: "chore: update API recordings due to API drift"
          body: |
            ## API Drift Detection

            This PR was automatically generated by the API drift detection workflow.

            Changes detected in recorded API responses:
            - `tests/__recordings__/` - Polly.js recording files
            - `tests/__typechecks__/` - Generated type test files

            Please review the changes and ensure they reflect expected API updates.

            If the changes are valid, merge this PR. If they indicate unexpected behavior, investigate and potentially revert.
          branch: api-drift-refresh-${{ github.run_number }}
          delete-branch: true
          labels: |
            automated
            api-drift
